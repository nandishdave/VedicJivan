name: Backend Tests (pytest)

# Runs the FastAPI/Kundli test suite on every backend change so regressions
# (e.g. the Kundli PDF cover being silently overwritten — guarded by
# test_kundli_pdf_cover.py) fail loudly instead of shipping unnoticed.
on:
  push:
    paths:
      - "api/**"
      - ".github/workflows/test-backend.yml"
  pull_request:
    paths:
      - "api/**"
      - ".github/workflows/test-backend.yml"

# Match the deploy workflows: opt JS actions into the Node 24 runtime.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: api/requirements-test.txt

      # WeasyPrint (PDF rendering, exercised by the snapshot tests) needs these
      # native libraries — mirrors api/Dockerfile. gcc for pyswisseph is already
      # present on the runner; build-essential is added defensively.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            libpango-1.0-0 \
            libpangocairo-1.0-0 \
            libpangoft2-1.0-0 \
            libgdk-pixbuf-2.0-0 \
            libcairo2 \
            libffi-dev

      - name: Install Python dependencies
        run: pip install -r requirements-test.txt

      # Lint gate — REPORT-ONLY for now (continue-on-error). Ruff config lives
      # in api/pyproject.toml. This surfaces quality signal (unused imports,
      # blind excepts, bugbear findings) without blocking the build; once the
      # backlog is burned down we can drop continue-on-error to make it a hard
      # gate. --output-format=github annotates the PR diff inline.
      - name: Lint (ruff, non-blocking)
        continue-on-error: true
        run: ruff check . --output-format=github

      # Tests use a mocked MongoDB (see tests/conftest.py), so no DB service is
      # needed. test_api_schemathesis.py is excluded: it fetches /openapi.json
      # from a LIVE API at import time (collection-time error when none is
      # running), so it is a separate live-only suite (run via docker compose).
      # Coverage is measured (config in pyproject.toml [tool.coverage]) and
      # printed as a term-missing summary — reported, not yet threshold-gated.
      - name: Run tests
        run: pytest -q --ignore=tests/test_api_schemathesis.py --cov --cov-report=term-missing
