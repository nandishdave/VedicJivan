name: Booking Reminders

on:
  schedule:
    # Run every hour (UTC)
    - cron: "0 * * * *"
  workflow_dispatch: # Allow manual trigger for testing

jobs:
  send-reminders:
    name: Send 24h Reminder Emails
    runs-on: ubuntu-latest
    steps:
      # Maintenance-aware guard: the CloudFront maintenance function returns 503
      # for the whole site while `maintenance_mode = true` (prod.tfvars). When
      # the app is in maintenance the API is down by design (ECS scaled to 0),
      # so there are no reminders to send — skip quietly instead of failing.
      # A non-503 means the app is live, so we proceed; a genuine API failure
      # while live will still surface as an error below.
      - name: Skip if app is in maintenance
        id: maint
        run: |
          site_code=$(curl -s -o /dev/null -w "%{http_code}" \
            https://vedicjivan.nandishdave.world/)
          echo "Site status: $site_code"
          if [ "$site_code" = "503" ]; then
            echo "App is in maintenance mode — skipping reminder run."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger reminder endpoint (prod)
        if: steps.maint.outputs.skip != 'true'
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            -X POST https://api.vedicjivan.nandishdave.world/api/internal/send-reminders \
            -H "X-Internal-Secret: ${{ secrets.INTERNAL_SECRET }}")
          echo "Response code: $response"
          if [ "$response" != "200" ]; then
            echo "ERROR: Reminder endpoint returned $response"
            exit 1
          fi
